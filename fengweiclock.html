<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24h at feng wei</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; }
    .corner-image { position: fixed; top: 0; right: 0; width: 50vw; height: auto; display: block; }
    .clock { position: relative; width: 100vw; height: 100vh; min-height: 600px; z-index: 1; }
    .hour {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(var(--angle))
        translateY(calc(-1 * min(39vw, 39vh))) rotate(calc(-1 * var(--angle)));
      text-align: center;
    }
    .hour-number { display: block; margin-bottom: 3px; }
    .player { display: flex; align-items: center; gap: 4px; margin: 2px 0; white-space: nowrap; }
    .track-number { width: 22px; }
    audio { width: clamp(120px, 16vw, 220px); height: 32px; }
  </style>
</head>
<body>
  <img class="corner-image" src="https://d2w9rnfcy7mm78.cloudfront.net/40419620/original_c96afb7bdea001f646f9b9ce908e5b0f.jpg?1760824501?bc=0" alt="">
  <main class="clock">
    <div class="hour" style="--angle:30deg"><span class="hour-number">1</span><div class="player"><span class="track-number">1</span><audio controls preload="none" src="https://economybooks.info/fengwei/1h.m4a"></audio></div><div class="player"><span class="track-number">13</span><audio controls preload="none" src="https://economybooks.info/fengwei/13h.m4a"></audio></div></div>
    <div class="hour" style="--angle:60deg"><span class="hour-number">2</span><div class="player"><span class="track-number">2</span><audio controls preload="none" src="https://economybooks.info/fengwei/2h.m4a"></audio></div><div class="player"><span class="track-number">14</span><audio controls preload="none" src="https://economybooks.info/fengwei/14h.m4a"></audio></div></div>
    <div class="hour" style="--angle:90deg"><span class="hour-number">3</span><div class="player"><span class="track-number">3</span><audio controls preload="none" src="https://economybooks.info/fengwei/3h.m4a"></audio></div><div class="player"><span class="track-number">15</span><audio controls preload="none" src="https://economybooks.info/fengwei/15h.m4a"></audio></div></div>
    <div class="hour" style="--angle:120deg"><span class="hour-number">4</span><div class="player"><span class="track-number">4</span><audio controls preload="none" src="https://economybooks.info/fengwei/4h.m4a"></audio></div><div class="player"><span class="track-number">16</span><audio controls preload="none" src="https://economybooks.info/fengwei/16h.m4a"></audio></div></div>
    <div class="hour" style="--angle:150deg"><span class="hour-number">5</span><div class="player"><span class="track-number">5</span><audio controls preload="none" src="https://economybooks.info/fengwei/5h.m4a"></audio></div><div class="player"><span class="track-number">17</span><audio controls preload="none" src="https://economybooks.info/fengwei/17h.m4a"></audio></div></div>
    <div class="hour" style="--angle:180deg"><span class="hour-number">6</span><div class="player"><span class="track-number">6</span><audio controls preload="none" src="https://economybooks.info/fengwei/6h.m4a"></audio></div><div class="player"><span class="track-number">18</span><audio controls preload="none" src="https://economybooks.info/fengwei/18h.m4a"></audio></div></div>
    <div class="hour" style="--angle:210deg"><span class="hour-number">7</span><div class="player"><span class="track-number">7</span><audio controls preload="none" src="https://economybooks.info/fengwei/7h.m4a"></audio></div><div class="player"><span class="track-number">19</span><audio controls preload="none" src="https://economybooks.info/fengwei/19h.m4a"></audio></div></div>
    <div class="hour" style="--angle:240deg"><span class="hour-number">8</span><div class="player"><span class="track-number">8</span><audio controls preload="none" src="https://economybooks.info/fengwei/8h.m4a"></audio></div><div class="player"><span class="track-number">20</span><audio controls preload="none" src="https://economybooks.info/fengwei/20h.m4a"></audio></div></div>
    <div class="hour" style="--angle:270deg"><span class="hour-number">9</span><div class="player"><span class="track-number">9</span><audio controls preload="none" src="https://economybooks.info/fengwei/9h.m4a"></audio></div><div class="player"><span class="track-number">21</span><audio controls preload="none" src="https://economybooks.info/fengwei/21h.m4a"></audio></div></div>
    <div class="hour" style="--angle:300deg"><span class="hour-number">10</span><div class="player"><span class="track-number">10</span><audio controls preload="none" src="https://economybooks.info/fengwei/10h.m4a"></audio></div><div class="player"><span class="track-number">22</span><audio controls preload="none" src="https://economybooks.info/fengwei/22h.m4a"></audio></div></div>

    <div class="hour" style="--angle:0deg"><span class="hour-number">12</span><div class="player"><span class="track-number">12</span><audio controls preload="none" src="https://economybooks.info/fengwei/12h.m4a"></audio></div><div class="player"><span class="track-number">24</span><audio controls preload="none" src="https://economybooks.info/fengwei/24h.m4a"></audio></div></div>
  </main>
</body>
</html>
